name: Pester Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    steps:
      - uses: actions/checkout@v4

      - name: Run Pester Tests
        shell: ${{ matrix.shell }}
        run: |
          Import-Module Pester -MinimumVersion 5.0 -Force
          $result = Invoke-Pester .\Tests -Output Detailed -PassThru

          # A file whose _Setup.ps1 errors out reports zero tests, which Result catches. PassedCount rather than TotalCount, because TotalCount counts skipped tests and a -Skip on a Describe would set it green with nothing actually verified.
          if ($result.Result -ne 'Passed' -or $result.PassedCount -lt 440) { exit 1 }
